name: Security investigation tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio
      - name: 验证安全系统
        env:
          USE_FAKE_MODEL: "true"
          SECURITY_RAG_MODE: lexical
        run: python -m pytest tests/security -q
